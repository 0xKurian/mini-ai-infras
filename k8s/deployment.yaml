apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-ai-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-ai
  template:
    metadata:
      labels:
        app: mini-ai
    spec:
      containers:
      - name: mini-ai
        image: mini-ai:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mini-ai-service
spec:
  type: NodePort
  selector:
    app: mini-ai
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080